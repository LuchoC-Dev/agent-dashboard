<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Dashboard — mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <script>
    // Mockup-only: ?theme=dark|light forces a theme and ?provider=claude|codex picks the
    // primary color (handy for screenshots). The app sets data-provider from the active source.
    (function () {
      var q = new URLSearchParams(location.search), t = q.get("theme"), p = q.get("provider");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-provider", p === "codex" ? "codex" : "claude");
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="1" y="1" width="18" height="18" rx="4" fill="var(--color-primary)"/>
          <rect x="5" y="10" width="2.4" height="5" rx="0.6" fill="var(--color-accent-ink)"/>
          <rect x="8.8" y="6" width="2.4" height="9" rx="0.6" fill="var(--color-accent-ink)"/>
          <rect x="12.6" y="8" width="2.4" height="7" rx="0.6" fill="var(--color-accent-ink)"/>
        </svg>
        <div>Agent Dashboard<small id="brand-sub">Claude Code</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div id="tip" role="tooltip"></div>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
